<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Symphony Install+ Print</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#fff;color:#182b3f}
.printbar{position:sticky;top:0;z-index:1000;display:flex;gap:10px;padding:12px;background:#fff;border-bottom:1px solid #d9dee5}
.printbar button{border:0;border-radius:9px;background:#c8102e;color:#fff;padding:12px 16px;font-weight:800;font-size:16px}
.printbar button.back{background:#082e59}
#report{padding:0 16px 30px}
@media print{.printbar{display:none!important}#report{padding:0}}
</style>
</head>
<body>
<div class="printbar"><button onclick="window.print()">Print / Save as PDF</button><button class="back" onclick="history.back()">Back</button></div>
<div id="report"></div>
<script>
(function(){
  const html=localStorage.getItem('sym-install-print-html');
  if(!html){document.getElementById('report').innerHTML='<p>No report is available to print. Please return to Symphony Install+ and create the report again.</p>';return;}
  document.getElementById('report').innerHTML=html;
})();
</script>
</body>
</html>
