name: Restore Clean Report Controls
on:
  push:
    paths:
      - 'scripts/restore_clean_report.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch report
        run: python3 scripts/restore_clean_report.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore clean legacy report printing" || exit 0
          git push
