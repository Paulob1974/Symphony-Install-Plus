name: Add Save to Device
on:
  push:
    paths:
      - '.github/workflows/add-save-to-device.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch report controls only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_btn = '<button class="share" onclick="shareReport()">Share Report</button><button onclick="printReport()">Print / Save as PDF</button><button onclick="returnToApp()">Close</button>'
          new_btn = '<button class="share" onclick="shareReport()">Share Report</button><button onclick="printReport()">Print</button><button onclick="saveToDevice()">Save to Device</button><button onclick="returnToApp()">Close</button>'
          if old_btn not in s:
              raise SystemExit('Expected report controls not found')
          s = s.replace(old_btn, new_btn, 1)
          old_fn = "function printReport(){window.focus();setTimeout(function(){try{window.print()}catch(e){alert('Use your browser menu and choose Print / Save as PDF.')}},150)}function returnToApp()"
          new_fn = "function printReport(){window.focus();setTimeout(function(){try{window.print()}catch(e){alert('Use your browser menu and choose Print.')}},150)}function saveToDevice(){try{const clone=document.documentElement.cloneNode(true),c=clone.querySelector('.controls');if(c)c.remove();const html='<!doctype html>'+clone.outerHTML,blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Symphony-Install-Report-${safe}.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(e){alert('The report could not be saved on this browser.')}}function returnToApp()"
          if old_fn not in s:
              raise SystemExit('Expected print function not found')
          s = s.replace(old_fn, new_fn, 1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add safe Save to Device option'
          git push
