name: Wire Real Print Page
on: push
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Print handoff only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          pattern=r"function openPrintPage\(\)\{try\{.*?\}\}"
          new="function openPrintPage(){try{const clone=document.documentElement.cloneNode(true),c=clone.querySelector('.controls');if(c)c.remove();clone.querySelectorAll('script').forEach(s=>s.remove());const styles=Array.from(document.querySelectorAll('style')).map(s=>s.outerHTML).join('');const body=clone.body.innerHTML;const html='<!doctype html><html><head><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Symphony Install+ Print</title>'+styles+'<style>.printbar{position:sticky;top:0;z-index:1000;display:flex;gap:10px;padding:12px;background:#fff;border-bottom:1px solid #d9dee5}.printbar button{border:0;border-radius:9px;background:#c8102e;color:#fff;padding:12px 16px;font-weight:800;font-size:16px}.printbar .back{background:#082e59}@media print{.printbar{display:none!important}}</style></head><body><div class=\"printbar\"><button onclick=\"window.print()\">Print / Save as PDF</button><button class=\"back\" onclick=\"history.back()\">Back</button></div>'+body+'</body></html>';const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));location.href=url}catch(e){alert('The print view could not be opened.')}}"
          s2,n=re.subn(pattern,new,s,count=1)
          if n!=1:
              raise SystemExit('Existing openPrintPage function not found; refusing to alter file')
          p.write_text(s2)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Print report via in-memory page" || exit 0
          git push
