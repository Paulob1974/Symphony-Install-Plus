name: Fix report controls

on:
  push:
    paths:
      - '.github/workflows/fix-report-controls.yml'

permissions:
  contents: write

jobs:
  fix-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch Print and Close buttons
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '<button onclick="window.print()">Print / Save as PDF</button><button onclick="window.close()">Close</button>'
          new = '<button onclick="printCompletedReport()">Print / Save as PDF</button><button onclick="closeCompletedReport()">Close</button>'

          if old not in s:
              raise SystemExit('Expected Print/Close controls were not found')

          s = s.replace(old, new, 1)

          marker = '  async function shareCompletedReport(){'
          helpers = '''  function printCompletedReport(){
            window.focus();
            setTimeout(()=>{
              try{ window.print(); }
              catch(err){ alert('Printing could not be opened automatically. Please use your browser menu and choose Print.'); }
            },120);
          }
          function closeCompletedReport(){
            try{
              if(window.opener && !window.opener.closed){
                window.opener.focus();
                window.close();
                setTimeout(()=>{
                  if(!window.closed){ window.location.href=window.opener.location.href; }
                },200);
                return;
              }
            }catch(err){}
            try{ window.history.back(); }catch(err){}
          }
          '''

          if 'function printCompletedReport()' not in s:
              if marker not in s:
                  raise SystemExit('Share function marker was not found')
              s = s.replace(marker, helpers + marker, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix report print and close controls"
          git push
