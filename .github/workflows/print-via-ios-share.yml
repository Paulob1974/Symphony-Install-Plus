name: Print via iPhone Share
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Print button only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<button onclick="window.print()">Print</button>'
          new='<button onclick="printViaShare()">Print</button>'
          if old not in s:
              raise SystemExit('Print button not found')
          s=s.replace(old,new,1)
          marker='function saveToDevice(){'
          fn="""async function printViaShare(){try{const clone=document.documentElement.cloneNode(true),c=clone.querySelector('.controls');if(c)c.remove();const html='<!doctype html>'+clone.outerHTML,blob=new Blob([html],{type:'text/html'}),file=new File([blob],'Symphony-Install-Report-${safe}.html',{type:'text/html'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({title:'Symphony Install+ Report - choose Print',text:'Choose Print from the iPhone share sheet.',files:[file]});return}alert('Use Share Report and choose Print from the iPhone share sheet.')}catch(e){if(e&&e.name==='AbortError')return;alert('Use Share Report and choose Print from the iPhone share sheet.')}}"""
          if marker not in s:
              raise SystemExit('Save function marker not found')
          s=s.replace(marker,fn+marker,1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use iPhone native share sheet for Print" || exit 0
          git push
