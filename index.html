<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#082E59" />
<title>Symphony Install+</title>
<style>
:root {
  --red:#c8102e;
  --navy:#082e59;
  --navy2:#062746;
  --bg:#f4f6f8;
  --text:#182b3f;
  --muted:#6d7886;
  --line:#d9dee5;
  --white:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
.hidden{display:none!important}
.hero{background:#fff}
.hero img{width:100%;height:240px;object-fit:cover;display:block}
.redline{height:5px;background:var(--red)}
.home{padding:24px;max-width:760px;margin:auto;text-align:center;background:#fff;min-height:calc(100vh - 245px)}
.brand{font-size:44px;font-weight:300;color:var(--red);margin-top:8px}
.rule{height:1px;background:var(--line);margin:22px 0}
.home h1{font-size:34px;line-height:1.05;color:var(--navy);margin:0}
.home p{color:var(--muted);font-size:17px;line-height:1.5}
.cta{width:100%;border:0;border-radius:16px;background:var(--navy);color:#fff;padding:24px;margin-top:26px;font-weight:800;font-size:18px}
.secondary{background:#fff;color:var(--red);border:1px solid var(--red)}
.app{max-width:780px;margin:auto}
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.topbar strong{font-size:17px}
.stepbar{display:flex;gap:7px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:50px;z-index:19}
.step{height:7px;flex:1;border-radius:5px;background:#dde2e7}
.step.active{background:var(--red)}
.screen{padding:18px 16px 40px}
h2{font-size:24px;margin:6px 0 8px;color:var(--navy)}
.lead{color:var(--muted);margin:0 0 20px;line-height:1.45}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:15px}
label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
input[type=text],input[type=date],textarea,select{width:100%;border:1px solid #cbd2db;border-radius:10px;background:#fff;padding:13px;font-size:16px;color:var(--text);margin-bottom:16px}
textarea{min-height:100px;resize:vertical}
.btn{width:100%;border:0;border-radius:11px;background:var(--red);color:#fff;padding:15px 16px;font-weight:900;font-size:16px;margin-top:10px}
.btn.alt{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.navy{background:var(--navy)}
.btn.small{width:auto;padding:10px 12px;font-size:14px;margin-top:0}
.photo-box{border:2px dashed #b7c0ca;background:#fafbfc;border-radius:12px;padding:14px;margin:10px 0 16px}
.photo-box h3{margin:0 0 8px;color:var(--navy)}
.file-row{display:flex;gap:10px;flex-wrap:wrap}
.fileBtn{position:relative;overflow:hidden;flex:1;min-width:140px;border:1px solid var(--red);color:var(--red);background:#fff;border-radius:10px;padding:12px;text-align:center;font-weight:800}
.fileBtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.thumb{position:relative}
.thumb img{width:100%;height:150px;object-fit:cover;border-radius:9px;display:block}
.thumb button{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(200,16,46,.92);color:#fff;font-weight:900}
.issue{border-left:5px solid var(--red)}
.issue-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.issue-head h3{margin:0;color:var(--navy)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:700}
.pill.on{border-color:var(--red);background:#fff0f2;color:var(--red)}
.signature-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
canvas.signature{width:100%;height:190px;display:block;background:#fff;border:1px solid #ccd3db;border-radius:8px;touch-action:none}
.sig-actions{display:flex;justify-content:flex-end;margin-top:8px}
.summary-row{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid #edf0f3}
.summary-row b{flex:1}
.summary-row span{flex:1;text-align:right}
.notice{background:#edf5ff;border:1px solid #b8d4f2;border-radius:11px;padding:13px;color:#184c81;line-height:1.45;margin:12px 0}
.draft{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px;text-align:left}
.draft small{color:var(--red);font-weight:900}
@media(min-width:680px){.thumbs{grid-template-columns:repeat(3,1fr)}}
@media print{body{background:#fff}#home,#app{display:none!important}}
</style>
</head>
